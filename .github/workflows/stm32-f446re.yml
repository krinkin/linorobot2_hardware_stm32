name: stm32-f446re-microros
# GUI-free native STM32 port CI: host unit tests + F0 firmware link + Renode tiers
# F2 boot / F4 control / F5 IMU (always-on), and F6 full topic round-trip (push-gated, docker).
# This is the only CI workflow; the upstream Arduino/PlatformIO multi-distro CI was removed.
on:
  push:
    paths: ['test_host/**', 'firmware/lib/**', 'firmware_stm32/**', 'Makefile', '.github/workflows/stm32-f446re.yml']
  pull_request:
    paths: ['test_host/**', 'firmware/lib/**', 'firmware_stm32/**', 'Makefile', '.github/workflows/stm32-f446re.yml']

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install g++ + make
        run: sudo apt-get update && sudo apt-get install -y g++ make curl
      - name: Tier A -- host unit tests
        run: make test-host

  stm32-f0-f2:
    runs-on: ubuntu-latest          # amd64 -- matches pinned image sub-digest 392246e5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive      # CMSIS/HAL/FreeRTOS + micro_ros utils @ pinned commits
      - name: Install host ARM toolchain + Renode-smoke runtime deps
        # socat reads USART2; iproute2 (ss) gates the F2 socket wait; gawk (strtonum) + xxd are
        # used by the smoke scripts. Mirrors docker/Dockerfile so CI matches the dev image.
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make socat iproute2 gawk xxd
      - name: Tier B -- build libmicroros.a (pinned Docker image) + link firmware (F0)
        run: |
          make libmicroros
          make build-fw
          arm-none-eabi-size firmware_stm32/build/firmware_stm32.elf
      - name: Set up Renode 1.16.1 portable
        # Portable build bundles its own runtime (no gtk-sharp2 / no apt deps). Used for all three
        # Renode tiers, same as the local Makefile and docker/Dockerfile.
        run: |
          curl -L -o /tmp/renode.tar.gz https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz
          mkdir -p /home/runner/renode-portable && tar -xzf /tmp/renode.tar.gz -C /home/runner/renode-portable --strip-components=1
          echo "RENODE=/home/runner/renode-portable/renode" >> "$GITHUB_ENV"
      - name: Tier C (F2) -- Renode boot smoke (firmware transmits the micro-ROS ping)
        run: make renode
      - name: Tier C (F4) -- encoder/PWM control loop smoke
        run: make control
      - name: Tier C (F5) -- MPU6050 IMU over HAL I2C
        run: make imu

  # F6 full base-node topic round-trip (needs Docker for micro_ros_agent + --network host).
  # Push-gated + continue-on-error until the docker round-trip is proven stable in CI.
  # TODO(remove by 2026-09): once stable across several pushes, drop continue-on-error and
  # run on PRs (or a firmware_stm32/** path gate) so F6 gates merges.
  stm32-topics:
    runs-on: ubuntu-latest
    needs: stm32-f0-f2
    if: github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain + Renode-smoke runtime deps
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make socat iproute2 gawk xxd
      - name: Set up Renode 1.16.1 portable
        run: |
          curl -L -o /tmp/renode.tar.gz https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz
          mkdir -p /home/runner/renode-portable && tar -xzf /tmp/renode.tar.gz -C /home/runner/renode-portable --strip-components=1
          echo "RENODE=/home/runner/renode-portable/renode" >> "$GITHUB_ENV"
      - name: Build libmicroros + firmware
        run: make libmicroros && make build-fw
      - name: F6 -- full base-node topic round-trip
        run: make topics
